services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loopeng
      # Card 438646e5: this used to be a bare literal, hardcoded in this
      # committed file -- identical to the value in .env.example, so any
      # agent worktree (or anyone else with repo read access) could recover
      # the real password for "the one real instance" with a plain file
      # read, no different from a plaintext secret sitting in source. Same
      # ${VAR:-default} pattern as WEB_API_KEY below: a real deployment sets
      # DB_PASSWORD via infrastructure/docker/.env (gitignored, never
      # committed), so its actual value is never reconstructable from
      # anything in this repo.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-loopeng}
      POSTGRES_DB: loopeng
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loopeng"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://loopeng:${DB_PASSWORD:-loopeng}@postgres:5432/loopeng
      WEB_API_KEY: ${WEB_API_KEY:-change-me-web-api-key}
      WIKI_REPO_PATH: /data/wiki-repo
      API_PORT: 4000
      # This is the one real instance -- the only place ORCHESTRATOR_ENABLED
      # should be set. Agent worktrees running apps/api locally (e.g. `tsx
      # watch` for manual UI verification) must never set this, or they'll
      # start a second orchestrator racing this one over the same DATABASE_URL.
      ORCHESTRATOR_ENABLED: "1"
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - wiki-repo:/data/wiki-repo
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-4000}
        NEXT_PUBLIC_WEB_API_KEY: ${WEB_API_KEY:-change-me-web-api-key}
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-4000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  pgdata:
  wiki-repo:
